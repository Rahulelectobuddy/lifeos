# ============================================================================
# LIFE OS NGINX SITE CONFIGURATION (MOUNTED TO /etc/nginx/conf.d/default.conf)
# ============================================================================

upstream backend_service {
    server backend:8000;
}

upstream frontend_service {
    server frontend:80;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 50M;

    # 1. API Endpoints Proxy
    location /api/ {
        proxy_pass http://backend_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Health Check Endpoint Proxy
    location /health {
        proxy_pass http://backend_service/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 3. WebSocket Connection Upgrade Proxy
    location /ws/ {
        proxy_pass http://backend_service/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 4. Frontend Web SPA Client Proxy & Fallback
    location / {
        proxy_pass http://frontend_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
