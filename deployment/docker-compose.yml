version: '3.8'

services:
  # 1. NGINX Reverse Proxy (Exposes Port 80)
  reverse-proxy:
    image: nginx:alpine
    container_name: lifeos_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: always
    networks:
      - lifeos_network

  # 2. Frontend React Web Client
  frontend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.frontend
    container_name: lifeos_frontend
    restart: always
    networks:
      - lifeos_network

  # 3. FastAPI Backend Monolith API
  backend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.backend
    container_name: lifeos_backend
    environment:
      - PROJECT_NAME=Life OS Backend API
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-lifeos}:${POSTGRES_PASSWORD:-cypherpass}@db:5432/${POSTGRES_DB:-lifeos_db}
      - REDIS_URL=redis://redis:6379/0
      - CORS_ORIGINS=["*"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always
    networks:
      - lifeos_network

  # 4. PostgreSQL 16 Database
  db:
    image: postgres:16-alpine
    container_name: lifeos_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lifeos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cypherpass}
      POSTGRES_DB: ${POSTGRES_DB:-lifeos_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lifeos} -d ${POSTGRES_DB:-lifeos_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - lifeos_network

  # 5. Redis 7 Cache & Pub/Sub Broker
  redis:
    image: redis:7-alpine
    container_name: lifeos_redis
    volumes:
      - redis_data:/data
    restart: always
    networks:
      - lifeos_network

volumes:
  postgres_data:
  redis_data:

networks:
  lifeos_network:
    driver: bridge
